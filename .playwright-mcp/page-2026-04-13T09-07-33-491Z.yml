                                - text: in
                                - code [ref=e781]: webviewMessageHandler.ts
                                - text: to ensure large file edits don't block the UI thread.
                            - heading "🔒 Security Vulnerabilities" [level=3] [ref=e782]
                            - paragraph [ref=e783]: No critical vulnerabilities detected. Image processing is restricted to base64 encoding within the extension context, and vector DB settings use VS Code's secret storage for API keys.
