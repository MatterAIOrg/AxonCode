                            - paragraph [ref=e758]:
                              - text: Release v6.0.0 introduces the
                              - strong [ref=e759]: Agent Manager
                              - text: ", a major UI/UX overhaul enabling multi-agent background task management and a dedicated side-panel file viewer. It implements full-stack"
                              - strong [ref=e760]: image attachment support
                              - text: (paste, drag-drop, and selection) across the webview, extension API, and core task execution. Additionally, it adds
                              - strong [ref=e761]: Codebase Indexing
                              - text: settings for Qdrant and various embedding providers, alongside improved diff rendering logic using Myers diff for pending edits.
                            - heading "🔍 Impact of the Change" [level=3] [ref=e762]
                            - paragraph [ref=e763]:
                              - text: Users can now manage multiple concurrent AI agents, view aggregated file changes in a structured sidebar, and provide visual context via images. The architectural shift to lifted state in
                              - code [ref=e764]: App.tsx
                              - text: ensures chat persistence during mode switches, significantly improving the multi-tasking workflow within the IDE.
